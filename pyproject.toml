[project]
name = "tech-event-predictor"
version = "0.1.0"
description = "Quantitative prediction system for tech events on Polymarket"
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Data collection
    "httpx>=0.27",
    "feedparser>=6.0",

    # NLP
    "nltk>=3.9",

    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.14",
    "joblib>=1.4",

    # LLM
    "anthropic>=0.40",

    # UI
    "rich>=13.0",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]
trading = [
    "py-clob-client>=0.17",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "collectors*", "features*", "decision*", "model*", "monitoring*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
