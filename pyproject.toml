[project]
name = "tech-event-predictor"
version = "0.1.0"
description = "Quantitative prediction system for tech events on Polymarket"
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Data collection
    "httpx>=0.27",
    "feedparser>=6.0",

    # NLP
    "nltk>=3.9",

    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.14",
    "joblib>=1.4",

    # LLM
    "anthropic>=0.40",

    # UI
    "rich>=13.0",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # Weather data
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]
trading = [
    "py-clob-client>=0.17",
]
ibkr = [
    "ib_async>=2.1",
]
climate = [
    "cdsapi>=0.7.4",
    "xarray>=2024.1",
    "netcdf4>=1.6",
]
mcp = [
    "mcp>=1.27,<2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "collectors*", "features*", "decision*", "model*", "monitoring*", "analysis*", "weather*", "mcp_server*", "legacy*", "climate*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Unrelated sub-projects and vendored tools are not held to this repo's lint.
extend-exclude = ["bist_brief", "learning", "context-hub", "notebooks"]

[tool.ruff.lint]
# Only the venue-import ban; no other rules beyond ruff's defaults.
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ib_async".msg = "Venue SDKs may only be imported under src/venues/ (see src/venues/base.py)"
"ibapi".msg = "Use ib_async, and only under src/venues/"
"py_clob_client".msg = "Only src/venues/polymarket.py and legacy/ may touch the Polymarket client"
"web3".msg = "On-chain code lives in legacy/polymarket_onchain/ only"
"eth_account".msg = "On-chain code lives in legacy/polymarket_onchain/ only"

[tool.ruff.lint.per-file-ignores]
"src/venues/**" = ["TID251"]
"legacy/**" = ["TID251"]
# Standalone diagnostics that talk to the Gateway directly, exempt by design
# (same class as the Stage 0 entitlement gate; read-only, run by the operator).
"scripts/verify_ibkr_entitlements.py" = ["TID251"]
"scripts/probe_ibkr_history.py" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
